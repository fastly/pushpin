[package]
name = "pushpin"
version = "1.42.0-dev"
authors = ["Fastly <oss@fastly.com>"]
description = "Reverse proxy for realtime web services"
repository = "https://github.com/fastly/pushpin"
readme = "README.md"
license = "Apache-2.0"
edition = "2018"
rust-version = "1.75"
default-run = "pushpin"

[features]
default = ["do-qmake", "do-cpp-build"]
do-qmake = []
do-cpp-build = []
no-seccomp = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
strip = "none"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
aegis = "^0.4.2"
arrayvec = "0.7"
backtrace = { version = "0.3", features = ["cpp_demangle"] }
base64 = "0.13"
bytes = "1"
clap = { version = "=4.3.24", features = ["cargo", "string", "wrap_help", "derive"] }
config = "0.14"
httparse = "1.7"
ipnet = "2"
jsonwebtoken = "9"
libc = "0.2"
log = "0.4"
miniz_oxide = "0.6"
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }
notify = "7"
openssl = "=0.10.72"
origind-client = { git = "ssh://git@github.com/fastly/origind.git", tag = "jenkins/release-1840-8275d8f" }
origind-common = { git = "ssh://git@github.com/fastly/origind.git", tag = "jenkins/release-1840-8275d8f" }
paste = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.6"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha1 = "0.10"
signal-hook = "0.3"
slab = "0.4"
socket2 = "0.4"
stats-emitter = { git = "ssh://git@github.com/fastly/stats-emitter-rs" }
thiserror = "1.0"
time = { version = "=0.3.41", features = ["formatting", "local-offset", "macros"] }
tokio-util = "0.7"
url = "2.3"
zmq = "0.9"
ctor = "^0.1.20"
http = "1"
hyper = { version = "1", features = ["full"] }
hyper-openssl = "0.9.1"
lazy_static = "^1.4.0"
pin-project = "1.0.8"
prometheus = "^0.12.0"
prometheus-utils = "^0.6.1"
rand = "^0.8.4"
static_assertions = "^1.1.0"
tokio = { version = "^1.13.1", features = ["full"] }
toml = "^0.5.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }

# for seccomp
nix = "^0.22.0"
memoffset = "^0.6.4"
httpmock = "0.7.0"

[dev-dependencies]
criterion = "0.5"
env_logger = { version = "0.9", default-features = false }
hyperlocal = "0.9"
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
reqwest = "0.11"
tempfile = "3.20.0"
test-log = "0.2"
tokio-openssl = "0.6"

# for stats-emitter
bincode = "^1.3.3"
maplit = "^1.0.2"
tempdir = "^0.3.7"
wiremock = "^0.5.6"

[build-dependencies]
pkg-config = "0.3"
time = { version = "0.3.36", features = ["formatting", "local-offset", "macros"] }
cbindgen = "0.27"

[[bench]]
name = "memorypool"
harness = false

[[bench]]
name = "list"
harness = false

[[bench]]
name = "server"
harness = false

[[bench]]
name = "client"
harness = false

[[bench]]
name = "http"
harness = false

[[bin]]
name = "pushpin-connmgr"
test = false
bench = false

[[bin]]
name = "m2adapter"
test = false
bench = false

[[bin]]
name = "pushpin-proxy"
test = false
bench = false

[[bin]]
name = "pushpin-handler"
test = false
bench = false

[[bin]]
name = "pushpin-legacy"
test = false
bench = false

[[bin]]
name = "pushpin"
test = false
bench = false

[[bin]]
name = "pushpin-publish"
test = false
bench = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(qt_lib_prefix, values("Qt", "Qt6", "Qt5"))', 'cfg(feature, values("no-seccomp"))'] }

[lints.clippy]
uninlined_format_args = "allow"
