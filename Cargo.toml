[package]
name = "pushpin"
version = "1.36.0-dev"
authors = ["Justin Karneges <justin@karneges.com>"]
edition = "2018"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
base64 = "0.12"
clap = { version = "2.33", features = ["wrap_help"] }
jsonwebtoken = "8"
libc = "0.2"
log = "0.4"
rustls = "0.19"
rustls-native-certs = "0.5"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
slab = "0.4"
webpki = "0.21"
zmq = "0.9"

# for stats-emitter
anyhow = "^1.0.42"
ctor = "^0.1.20"
http = "^0.2.7"
hyper = { version = "^0.14.11", features = ["full"] }
hyper-openssl = "0.9.1"
lazy_static = "^1.4.0"
openssl = "^0.10.38"
pin-project = "1.0.8"
prometheus = "^0.12.0"
prometheus-utils = "^0.6.1"
rand = "^0.8.4"
static_assertions = "^1.1.0"
thiserror = "^1.0.26"
tokio = { version = "^1.13.1", features = ["full"] }
toml = "^0.5.8"
tracing = "^0.1.26"
tracing-subscriber = "^0.3"

# for stats-emitter
[dev-dependencies]
bincode = "^1.3.3"
maplit = "^1.0.2"
tempdir = "^0.3.7"
wiremock = "^0.5.6"

[lib]
crate-type = ["rlib", "staticlib"]
